<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر إلكتروني باب رزق</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--txt:#1d2b22;--mut:#5d6b62;--pri:#0f6b45;--bd:#d9e1db;--hd:#0b4f33;--ft:#0b4f33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#1a231e;--txt:#e8efe9;--mut:#9fb0a4;--pri:#3fbf86;--bd:#2c3a32;--hd:#0a2f1f;--ft:#0a2f1f}}
:root[data-theme="dark"]{--bg:#101613;--card:#1a231e;--txt:#e8efe9;--mut:#9fb0a4;--pri:#3fbf86;--bd:#2c3a32;--hd:#0a2f1f;--ft:#0a2f1f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,#06371f,#0f6b45 55%,#0b4f33);color:#fff;border-bottom:4px solid #f2b630;box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:2}
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:1200px;margin:auto}
.logo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:radial-gradient(#ffe08a,#f2b630);box-shadow:0 0 0 3px rgba(255,255,255,.35);flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:clamp(1.4rem,4.2vw,2.3rem);line-height:1.2;color:#ffe08a;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.ttl p{margin:3px 0 0;font-size:clamp(.8rem,2vw,1rem);opacity:.92}
.call{flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;color:#fff;text-decoration:none;font-weight:700;direction:ltr;white-space:nowrap}
.call:hover{background:#f2b630;color:#2a1d00}
.ticker{display:flex;align-items:center;background:#f2b630;color:#2a1d00;font-weight:600}
.ticker b{flex:none;background:#0b4f33;color:#ffe08a;padding:8px 16px;white-space:nowrap}
.tk{flex:1;overflow:hidden;white-space:nowrap;padding:8px 0}
.tk span{display:inline-block;animation:mv 40s linear infinite}
.tk:hover span{animation-play-state:paused}
@keyframes mv{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.wrap{flex:1;display:flex;min-height:0}
nav{order:-1;width:230px;flex:none;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--card);border-inline-end:1px solid var(--bd);overflow-y:auto}
nav button{--h:150;font:inherit;font-weight:700;font-size:1rem;color:#fff;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start;
background:hsl(var(--h) 55% 36%);box-shadow:0 3px 0 hsl(var(--h) 55% 24%);transition:all .2s}
nav button:hover{background:hsl(calc(var(--h) + 70) 70% 42%);box-shadow:0 3px 0 hsl(calc(var(--h) + 70) 70% 28%);transform:translateY(-2px)}
nav button.on{background:#f2b630;color:#2a1d00;box-shadow:0 3px 0 #b88700}
